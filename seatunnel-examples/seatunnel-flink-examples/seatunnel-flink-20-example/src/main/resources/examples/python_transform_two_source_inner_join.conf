env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "left_input"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [301, " Eve ", 28]
      },
      {
        kind = INSERT
        fields = [302, "Frank", 35]
      }
    ]
  }

  FakeSource {
    plugin_output = "right_input"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [301, "Finance", 1]
      },
      {
        kind = INSERT
        fields = [302, "HR", 2]
      }
    ]
  }
}

sql {
  plugin_output = "joined_input"
  query = "SELECT l.id, l.name, l.age, r.id AS right_id, r.name AS right_name, r.age AS right_age FROM left_input AS l INNER JOIN right_input AS r ON l.id = r.id"
}

transform {
  Python {
    plugin_input = "joined_input"
    plugin_output = "joined_python"
    source_code_path = "/tmp/seatunnel-python-transform.py"
    script_config = {
      source_tag = "joined"
    }
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      },
      {
        dest_field = source_tag
        dest_type = string
      }
    ]
  }
}

sink {
  Console {
    plugin_input = "joined_python"
  }
}
