env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "fake_a"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [101, " Alice ", 20]
      },
      {
        kind = INSERT
        fields = [102, "Bob", 30]
      }
    ]
  }

  FakeSource {
    plugin_output = "fake_b"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [201, " Carol ", 40]
      },
      {
        kind = INSERT
        fields = [202, "Dave", 50]
      }
    ]
  }

  Jdbc {
    plugin_output = "postgres_input"
    url = "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
    driver = "org.postgresql.Driver"
    username = "${PG_USER}"
    password = "${PG_PASSWORD}"
    query = "select id, name, age from public.seatunnel_python_input order by id"
  }

  Http {
    plugin_output = "http_input"
    url = "http://127.0.0.1:18080/orders"
    method = "GET"
    format = "json"
    content_field = "$[*]"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
  }
}

transform {
  Python {
    plugin_input = "fake_a"
    plugin_output = "python_a"
    source_code_path = "/tmp/seatunnel-python-transform.py"
    script_config = {
      source_tag = "fake_a"
    }
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      },
      {
        dest_field = source_tag
        dest_type = string
      }
    ]
  }

  Python {
    plugin_input = "fake_b"
    plugin_output = "python_b"
    source_code_path = "/tmp/seatunnel-python-transform.py"
    script_config = {
      source_tag = "fake_b"
    }
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      },
      {
        dest_field = source_tag
        dest_type = string
      }
    ]
  }

  Python {
    plugin_input = "postgres_input"
    plugin_output = "python_postgres"
    source_code_path = "/tmp/seatunnel-python-transform.py"
    script_config = {
      source_tag = "postgres"
    }
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      },
      {
        dest_field = source_tag
        dest_type = string
      }
    ]
  }

  Python {
    plugin_input = "http_input"
    plugin_output = "python_http"
    source_code_path = "/tmp/seatunnel-python-transform.py"
    script_config = {
      source_tag = "http"
    }
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      },
      {
        dest_field = source_tag
        dest_type = string
      }
    ]
  }
}

sink {
  Console {
    plugin_input = "python_a"
  }

  Console {
    plugin_input = "python_b"
  }

  Console {
    plugin_input = "python_http"
  }

  Jdbc {
    plugin_input = "python_postgres"
    url = "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
    driver = "org.postgresql.Driver"
    username = "${PG_USER}"
    password = "${PG_PASSWORD}"
    generate_sink_sql = true
    database = "${PG_DATABASE}"
    schema = "public"
    table = "public.seatunnel_python_output"
    primary_keys = ["id"]
  }
}

lifecycle {
  source {
    postgres_input {
      pre {
        type = "jdbc_ready"
        url = "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
        driver = "org.postgresql.Driver"
        username = "${PG_USER}"
        password = "${PG_PASSWORD}"
        query = "select 1"
        expect = "1"
      }
    }
  }

  sink {
    python_postgres {
      pre {
        type = "jdbc_ready"
        url = "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
        driver = "org.postgresql.Driver"
        username = "${PG_USER}"
        password = "${PG_PASSWORD}"
        query = "select 1"
        expect = "1"
      }
      post {
        type = "jdbc_recon"
        url = "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
        driver = "org.postgresql.Driver"
        username = "${PG_USER}"
        password = "${PG_PASSWORD}"
        source_query = "select count(*), md5(string_agg(id || ':' || lower(trim(name)) || ':' || (age + 1), ',' order by id)) from public.seatunnel_python_input"
        sink_query = "select count(*), md5(string_agg(id || ':' || normalized_name || ':' || age_plus_one, ',' order by id)) from public.seatunnel_python_output"
      }
    }
  }
}
