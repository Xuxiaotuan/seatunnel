apiVersion: seatunnel.apache.org/v1alpha1
kind: FlinkGraphJob
runtime:
  engine: flink
  version: "1.20.5"
  mode: batch
nodes:
  enrich:
    plugin: sql
    operation: query
    inputs:
      orders: orders
      customers: customers
    config:
      query: SELECT o.order_id, c.customer_name FROM orders o JOIN customers c ON o.customer_id = c.customer_id
