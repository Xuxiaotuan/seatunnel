apiVersion: seatunnel.apache.org/v1alpha1
kind: FlinkGraphJob
runtime:
  engine: flink
  version: "1.20.5"
  mode: batch
  parallelism: 1
nodes:
  prepare:
    plugin: jdbc_action
    operation: check
    config:
      url: ${PG_URL}
      user: ${PG_USER}
      password: ${PG_PASSWORD}
      query: SELECT 1
  orders:
    plugin: Jdbc
    operation: read
    inputs: [prepare]
    config:
      url: ${PG_URL}
      driver: org.postgresql.Driver
      username: ${PG_USER}
      password: ${PG_PASSWORD}
      query: SELECT id, customer_id, amount FROM public.orders
  normalize:
    plugin: Python
    operation: map
    inputs: [orders]
    config:
      columns:
        - dest_field: amount_text
          dest_type: string
      source_code: |
        def process(row, context):
            return {"amount_text": str(row["amount"])}
  output:
    plugin: Jdbc
    operation: write
    inputs: [normalize]
    config:
      url: ${PG_URL}
      driver: org.postgresql.Driver
      username: ${PG_USER}
      password: ${PG_PASSWORD}
      table: public.orders_enriched
  recon:
    plugin: jdbc_action
    operation: check
    inputs: [output]
    config:
      url: ${PG_URL}
      user: ${PG_USER}
      password: ${PG_PASSWORD}
      query: SELECT 1
