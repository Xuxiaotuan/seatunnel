apiVersion: seatunnel.apache.org/v1alpha1
kind: FlinkGraphJob
runtime:
  engine: flink
  version: "1.20.5"
  mode: batch
  parallelism: 1
nodes:
  orders:
    plugin: FakeSource
    operation: read
    config:
      row.num: 8
      schema:
        fields:
          id: int
          name: string
  customers:
    plugin: FakeSource
    operation: read
    config:
      row.num: 8
      schema:
        fields:
          id: int
          customer_name: string
  normalized:
    plugin: Python
    operation: map
    inputs: [orders]
    config:
      columns:
        - dest_field: normalized_name
          dest_type: string
      source_code: |
        def process(row, context):
            return {"normalized_name": row["name"].strip().lower()}
  enrich:
    plugin: sql
    operation: query
    inputs: [normalized, customers]
    config:
      query: |
        SELECT c.id, n.normalized_name, c.customer_name
        FROM normalized n
        JOIN customers c ON n.id = c.id
  output:
    plugin: Console
    operation: write
    inputs: [enrich]
